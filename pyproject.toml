[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SimDSP"
version = "2.0.0"
description = "SimDSP 2.0 - DSP simulation software"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "numba",
  "PySide6",
  "pyqtgraph",
  "sounddevice",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
simdsp-smoke-audio = "app_desktop.smoke_audio:main"
simdsp-desktop = "app_desktop.live_ui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app_desktop",
  "app_desktop.*",
  "simdsp_blocks",
  "simdsp_blocks.*",
  "simdsp_core",
  "simdsp_core.*",
  "simdsp_io",
  "simdsp_io.*",
  "simdsp_native",
  "simdsp_native.*",
]
exclude = [
  "legacy",
  "legacy.*",
  "tests",
  "tests.*",
]
