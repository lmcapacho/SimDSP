name: Release

on:
  push:
    tags:
      - "v*"
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    name: Linux Release Asset
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libfftw3-dev \
            libegl1 \
            libqscintilla2-qt5-dev \
            libasound2-dev \
            libjack-dev \
            libpulse-dev \
            oss4-dev \
            libmatio-dev

      - name: Package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release_build"
          cd "$RUNNER_TEMP/release_build"
          bash "$GITHUB_WORKSPACE/tools/release.sh" \
            -version "${{ steps.meta.outputs.version }}" \
            -qt-path "${{ steps.qt.outputs.qtPath }}"

      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release_build/simdsp-${{ steps.meta.outputs.version }}.linux.AMD64.tar.gz
          fail_on_unmatched_files: true

  windows-release:
    name: Windows Release Asset
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qscintilla-qt5

      - name: Build
        run: |
          if command -v qmake-qt5 >/dev/null 2>&1; then
            qmake-qt5 SimDSP.pro
          elif [ -x /mingw64/qt5/bin/qmake ]; then
            /mingw64/qt5/bin/qmake SimDSP.pro
          else
            echo "ERROR: Qt5 qmake not found (qmake-qt5 or /mingw64/qt5/bin/qmake)."
            exit 1
          fi
          make -j

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $qmake = Get-ChildItem -Path "$env:RUNNER_TEMP","$env:SystemDrive\" -Recurse -Filter "qmake-qt5.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($qmake)) {
            $qmake = Get-ChildItem -Path "$env:RUNNER_TEMP","$env:SystemDrive\" -Recurse -Filter "qmake.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "mingw64" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($qmake)) { throw "Qt5 qmake not found" }
          $qtHome = Split-Path (Split-Path $qmake -Parent) -Parent
          $mingwMake = Get-ChildItem -Path "$env:RUNNER_TEMP","$env:SystemDrive\" -Recurse -Filter "mingw32-make.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($mingwMake)) { throw "mingw32-make.exe not found" }
          $mingwRoot = Split-Path (Split-Path $mingwMake -Parent) -Parent
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\release_build" -Force | Out-Null
          Push-Location "$env:RUNNER_TEMP\release_build"
          & cmd /c "`"$env:GITHUB_WORKSPACE\tools\release.bat`" $version `"$qtHome`" `"$mingwRoot`""
          if ($LASTEXITCODE -ne 0) { throw "release.bat failed" }
          Pop-Location

      - name: Zip Windows package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $out = Join-Path $env:RUNNER_TEMP "release_build\simdsp-$version.windows.AMD64"
          $zip = Join-Path $env:RUNNER_TEMP "release_build\simdsp-$version.windows.AMD64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $out -DestinationPath $zip

      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release_build/simdsp-${{ steps.meta.outputs.version }}.windows.AMD64.zip
          fail_on_unmatched_files: true
