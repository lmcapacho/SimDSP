name: Release

on:
  push:
    tags:
      - "v*"
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-release:
    name: Linux Release Asset
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libfftw3-dev \
            libegl1 \
            libqscintilla2-qt5-dev \
            libasound2-dev \
            libjack-dev \
            libpulse-dev \
            oss4-dev \
            libmatio-dev

      - name: Package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release_build"
          cd "$RUNNER_TEMP/release_build"
          bash "$GITHUB_WORKSPACE/tools/release.sh" \
            -version "${{ steps.meta.outputs.version }}" \
            -qt-path "${{ steps.qt.outputs.qtPath }}"

      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release_build/simdsp-${{ steps.meta.outputs.version }}.linux.AMD64.tar.gz
          fail_on_unmatched_files: true

  windows-release:
    name: Windows Release Asset
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qscintilla-qt5

      - name: Build
        run: |
          if command -v qmake-qt5 >/dev/null 2>&1; then
            qmake-qt5 SimDSP.pro
          elif [ -x /mingw64/qt5/bin/qmake ]; then
            /mingw64/qt5/bin/qmake SimDSP.pro
          else
            echo "ERROR: Qt5 qmake not found (qmake-qt5 or /mingw64/qt5/bin/qmake)."
            exit 1
          fi
          make -j

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $out = Join-Path $env:RUNNER_TEMP "simdsp-$version.windows.AMD64"
          $zip = Join-Path $env:RUNNER_TEMP "simdsp-$version.windows.AMD64.zip"

          $dllDir = Join-Path $out "resources\dlls"
          $includeDir = Join-Path $out "resources\include"
          $examplesDir = Join-Path $out "resources\examples"
          $iconsDir = Join-Path $out "resources\icons"
          New-Item -ItemType Directory -Path $dllDir -Force | Out-Null
          New-Item -ItemType Directory -Path $includeDir -Force | Out-Null
          New-Item -ItemType Directory -Path $examplesDir -Force | Out-Null
          New-Item -ItemType Directory -Path $iconsDir -Force | Out-Null

          Copy-Item "src\build\SimDSP.exe" "$dllDir\" -Force
          if (!(Test-Path "$dllDir\SimDSP.exe")) { throw "SimDSP.exe was not generated" }
          if (Test-Path "src\build\sdcore.dll") { Copy-Item "src\build\sdcore.dll" "$dllDir\" -Force }
          if (Test-Path "src\build\libsdcore.a") { Copy-Item "src\build\libsdcore.a" "$dllDir\" -Force }
          if (Test-Path "dependencies\rtaudio\libs\windows-64\librtaudio-6.dll") { Copy-Item "dependencies\rtaudio\libs\windows-64\librtaudio-6.dll" "$dllDir\" -Force }
          if (Test-Path "dependencies\rtaudio\libs\windows-64\librtaudio.dll.a") { Copy-Item "dependencies\rtaudio\libs\windows-64\librtaudio.dll.a" "$dllDir\" -Force }
          if (Test-Path "dependencies\rtaudio\libs\windows-64\librtaudio.a") { Copy-Item "dependencies\rtaudio\libs\windows-64\librtaudio.a" "$dllDir\" -Force }
          Copy-Item "dependencies\matio\libmatio.dll","dependencies\matio\hdf5.dll","dependencies\matio\zlib.dll" "$dllDir\" -Force
          Copy-Item "dependencies\fftw3\libfftw3-3.dll","dependencies\fftw3\libfftw3f-3.dll","dependencies\fftw3\libfftw3l-3.dll" "$dllDir\" -Force
          Copy-Item "src\include\simdsp.h","src\include\sdfunctions.h" "$includeDir\" -Force
          Copy-Item "src\gui\resources\images\icons\simdsp.ico" "$iconsDir\" -Force
          Copy-Item "scripts\simdsp.bat" "$out\" -Force
          Copy-Item "README.md","LICENSE" "$out\" -Force
          Copy-Item "src\examples\*" "$examplesDir\" -Recurse -Force

          $windeployqt = Get-ChildItem -Path "$env:RUNNER_TEMP","$env:SystemDrive\" -Recurse -Filter "windeployqt*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "mingw64|qt5" } |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($windeployqt)) { throw "windeployqt not found" }
          & $windeployqt --no-angle "$dllDir\SimDSP.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          $mingwBin = Split-Path -Parent $windeployqt
          $mingwRoot = Split-Path -Parent $mingwBin
          $objdump = Join-Path $mingwBin "objdump.exe"
          if (!(Test-Path $objdump)) { throw "objdump.exe not found next to Qt/MinGW binaries" }
          $copied = New-Object System.Collections.Generic.HashSet[string] ([System.StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem $dllDir -Filter *.dll | ForEach-Object { [void]$copied.Add($_.Name) }
          Get-ChildItem $dllDir -Filter *.exe | ForEach-Object { [void]$copied.Add($_.Name) }

          $changed = $true
          while ($changed) {
            $changed = $false
            $binaries = Get-ChildItem $dllDir -File | Where-Object { $_.Extension -in @(".exe", ".dll") }
            foreach ($binary in $binaries) {
              $imports = & $objdump -p $binary.FullName | Select-String "DLL Name:" | ForEach-Object {
                ($_ -replace '.*DLL Name:\s*', '').Trim()
              }
              foreach ($dll in $imports) {
                if ($copied.Contains($dll)) { continue }
                $src = Join-Path $mingwBin $dll
                if (Test-Path $src) {
                  Copy-Item $src "$dllDir\" -Force
                  [void]$copied.Add($dll)
                  $changed = $true
                }
              }
            }
          }

          if (!(Test-Path "$dllDir\Qt5Core.dll")) { throw "Qt5Core.dll missing from package" }
          if (!(Test-Path "$dllDir\SimDSP.exe")) { throw "SimDSP.exe missing from package" }
          New-Item -ItemType Directory -Path "$out\MinGW" -Force | Out-Null
          Copy-Item "$mingwRoot\bin" "$out\MinGW\" -Recurse -Force
          Copy-Item "$mingwRoot\include" "$out\MinGW\" -Recurse -Force
          Copy-Item "$mingwRoot\lib" "$out\MinGW\" -Recurse -Force
          if (Test-Path "$mingwRoot\libexec") { Copy-Item "$mingwRoot\libexec" "$out\MinGW\" -Recurse -Force }

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $out -DestinationPath $zip

      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/simdsp-${{ steps.meta.outputs.version }}.windows.AMD64.zip
          fail_on_unmatched_files: true
